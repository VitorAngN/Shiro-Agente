<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SHIRO</title>
<style>
html, body { margin: 0; height: 100%; background: #11141B; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<script type="module">
// A SHIRO em 3D dentro do programa. O Flutter chama window.setMood(...) a cada mudança de estado.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

let mood = 'idle';
let vrm = null;
window.setMood = (next) => { mood = next; };

const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x11141b);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(22, 1, 0.1, 20);
const focus = new THREE.Vector3(0, 1.3, 0);
scene.add(new THREE.AmbientLight(0xffffff, 1.15));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(1, 2, 2); scene.add(key);
const rim = new THREE.DirectionalLight(0x34e4f0, 1.3); rim.position.set(-2, 1.5, -1.5); scene.add(rim);
const gaze = new THREE.Object3D(); gaze.position.set(0, 1.4, 2); scene.add(gaze);

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const bone = (name) => vrm?.humanoid?.getNormalizedBoneNode(name) ?? null;
const express = (name, value) => { try { vrm?.expressionManager?.setValue(name, value); } catch {} };

let nextBlink = 2, blink = 0;
function animate(t, dt) {
  if (!vrm) return;
  const breath = Math.sin(t * 1.6) * 0.02;
  const chest = bone('chest') ?? bone('spine'); if (chest) chest.rotation.x = breath;
  const la = bone('leftUpperArm'), ra = bone('rightUpperArm');
  if (la) la.rotation.z = -1.25 + breath; if (ra) ra.rotation.z = 1.25 - breath;
  const pose = {
    idle:      [Math.sin(t * 0.5) * 0.03, Math.sin(t * 0.35) * 0.06, 0],
    listening: [0.06, 0, 0.12],
    thinking:  [-0.12, 0.22 + Math.sin(t * 0.8) * 0.04, -0.05],
    speaking:  [Math.sin(t * 3.1) * 0.03, Math.sin(t * 1.3) * 0.05, 0],
    offline:   [0.25, 0, 0],
  }[mood] ?? [0, 0, 0];
  const head = bone('head') ?? bone('neck');
  if (head) {
    const k = Math.min(1, dt * 6);
    head.rotation.x += (pose[0] - head.rotation.x) * k;
    head.rotation.y += (pose[1] - head.rotation.y) * k;
    head.rotation.z += (pose[2] - head.rotation.z) * k;
  }
  nextBlink -= dt;
  if (nextBlink <= 0) { blink = 0.16; nextBlink = 2.5 + Math.random() * 3; }
  blink = Math.max(0, blink - dt);
  express('blink', mood === 'offline' ? 1 : (blink > 0 ? Math.sin((blink / 0.16) * Math.PI) : 0));
  express('aa', mood === 'speaking' ? Math.max(0, Math.sin(t * 11) * Math.sin(t * 3.7)) * 0.9 : 0);
  express('happy', mood === 'listening' ? 0.25 : 0);
  gaze.position.x = mood === 'thinking' ? 0.8 : 0; gaze.position.y = mood === 'thinking' ? 1.9 : 1.4;
  vrm.update(dt);
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  animate(clock.elapsedTime, dt);
  renderer.render(scene, camera);
});

const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));
loader.load('./SHIRO.vrm', (gltf) => {
  const model = gltf.userData.vrm;
  if (!model) return;
  VRMUtils.rotateVRM0(model);
  model.scene.traverse((o) => { o.frustumCulled = false; });
  vrm = model; scene.add(vrm.scene);
  if (vrm.lookAt) vrm.lookAt.target = gaze;
  vrm.scene.updateMatrixWorld(true);
  const head = vrm.humanoid?.getNormalizedBoneNode('head');
  const y = head ? head.getWorldPosition(new THREE.Vector3()).y : 1.4;
  focus.set(0, y - 0.12, 0); camera.position.set(0, y - 0.05, 2.3); camera.lookAt(focus);
  document.title = 'pronta';
}, undefined, () => { document.title = 'sem-modelo'; });
</script>
</body>
</html>
