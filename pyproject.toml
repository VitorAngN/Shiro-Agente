[project]
name = "shiro"
version = "0.1.0.dev0"
description = "Assistente pessoal com IA para Windows: voz, automação do PC e atividades. Local-first e seguro por padrão."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "VitorAngN" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "aiosqlite>=0.20",
    "comtypes>=1.4 ; sys_platform == 'win32'",
    "fastapi>=0.115",
    "faster-whisper>=1.1",
    "google-genai>=1.0",
    "httpx>=0.27",
    "keyring>=25",
    "numpy>=1.26",
    "pillow>=10",
    "ollama>=0.5",
    "psutil>=6.0",
    "pycaw>=20240316 ; sys_platform == 'win32'",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pystray>=0.19 ; sys_platform == 'win32'",
    "sounddevice>=0.5",
    "structlog>=24.4",
    "uvicorn>=0.30",
    "websockets>=13",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "edge-tts>=7.0",
    "miniaudio>=1.61",
]

[project.scripts]
shiro = "shiro.interfaces.cli.main:main"

[project.gui-scripts]
# Sem janela de console: é o que o início com o Windows chama (ADR-0008).
shiro-tray = "shiro.interfaces.tray.main:main"

[project.urls]
Repository = "https://github.com/VitorAngN/Shiro-Agente"
Documentation = "https://github.com/VitorAngN/Shiro-Agente/tree/main/docs"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "pyright[nodejs]>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.17",
]
# Voz Kokoro (ADR-0015). Só é importada no processo do kokoro_worker, porque a
# fonetização depende de espeak-ng e phonemizer (GPL-3).
kokoro = ["kokoro-onnx>=0.4"]

[tool.uv]
# A voz Kokoro entra por padrão no ambiente, mas fica fora dos metadados do pacote (ADR-0015).
default-groups = ["dev", "kokoro"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shiro"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]  # trechos de código da documentação são ilustrativos

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # imports ordenados
    "N",             # nomes
    "UP",            # sintaxe moderna
    "B",             # bugbear
    "A",             # sombras de builtins
    "C4",            # comprehensions
    "SIM",           # simplificações
    "PTH",           # pathlib em vez de os.path
    "DTZ",           # datetime sempre com fuso (importante para atividades)
    "S",             # segurança (bandit)
    "ASYNC",         # armadilhas de asyncio
    "T20",           # sem print fora da CLI
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/shiro/interfaces/cli/*" = ["T201"]
"evals/**" = ["T201"]  # scripts de avaliação imprimem relatório no terminal

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = [
    "src/shiro/structures",
    "src/shiro/domain",
    "src/shiro/application",
    "src/shiro/config",
    "src/shiro/infrastructure/llm",
    "src/shiro/interfaces/api",
]
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "windows: requer Windows",
    "ollama: requer Ollama rodando localmente (SHIRO_TEST_OLLAMA=1)",
    "gpu: requer GPU NVIDIA (SHIRO_TEST_GPU=1)",
]

[tool.coverage.run]
source = ["shiro"]
branch = true
# Adaptadores que só rodam no Windows real (COM, teclas de mídia, ShellExecute).
# São verificados manualmente no PC; a lógica das ferramentas é testada com dublês.
omit = [
    "src/shiro/infrastructure/tools/windows/*",
    "src/shiro/infrastructure/voice/windows/*",
    "src/shiro/infrastructure/voice/devices.py",
    "src/shiro/infrastructure/voice/kokoro_worker.py",
    "src/shiro/infrastructure/system/autostart.py",
    "src/shiro/interfaces/tray/dialogs.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# ---------------------------------------------------------------- arquitetura
[tool.importlinter]
root_package = "shiro"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Camadas: cada uma só depende das de baixo (ADR-0020)"
type = "layers"
layers = [
    "shiro.interfaces",
    "shiro.bootstrap",
    "shiro.infrastructure",
    "shiro.application",
    "shiro.config",
    "shiro.domain",
    "shiro.structures",
]

[[tool.importlinter.contracts]]
name = "Domínio e aplicação sem I/O nem bibliotecas de infraestrutura (ADR-0020)"
type = "forbidden"
source_modules = ["shiro.domain", "shiro.application", "shiro.structures"]
forbidden_modules = [
    "aiosqlite",
    "fastapi",
    "faster_whisper",
    "httpx",
    "keyring",
    "onnxruntime",
    "psutil",
    "sounddevice",
    "starlette",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Adaptadores não dependem uns dos outros (ADR-0002)"
type = "independence"
modules = [
    "shiro.infrastructure.embeddings",
    "shiro.infrastructure.llm",
    "shiro.infrastructure.observability",
    "shiro.infrastructure.persistence",
    "shiro.infrastructure.voice",
]
