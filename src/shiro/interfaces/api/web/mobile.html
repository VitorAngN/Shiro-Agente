<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<meta name="mobile-web-app-capable" content="yes">
<title>SHIRO</title>
<style>
  :root {
    --bg: #0B0D12; --surface: #11141B; --raised: #161A23; --line: #262C38;
    --fg: #EEF1F6; --muted: #9AA3B2; --red: #FF2E4D; --cyan: #34E4F0; --yellow: #FFD23F;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .brand { letter-spacing: .3em; color: var(--red); font-weight: 600; font-size: 14px; }
  .state { font-size: 13px; color: var(--muted); padding: 4px 12px; border: 1px solid var(--line);
    border-radius: 999px; }
  .state.on { color: var(--cyan); border-color: var(--cyan); }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .you { align-self: flex-end; max-width: 85%; background: var(--raised); border-radius: 14px 14px 4px 14px;
    padding: 10px 14px; }
  .her { align-self: flex-start; max-width: 85%; background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px 14px 14px 4px; padding: 10px 14px; white-space: pre-wrap; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .confirm { border: 1px solid var(--yellow); border-radius: 14px; padding: 12px 14px; color: var(--yellow);
    display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .confirm button { min-width: 64px; }
  .bar { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--cyan);
    display: none; }
  .bar.show { display: block; }
  footer { display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); }
  input { flex: 1; min-width: 0; background: var(--surface); color: var(--fg); border: 1px solid var(--line);
    border-radius: 999px; padding: 12px 16px; font-size: 16px; }
  input:focus { outline: none; border-color: var(--cyan); }
  button { background: var(--fg); color: var(--bg); border: 0; border-radius: 999px; padding: 12px 16px;
    font-size: 15px; font-weight: 600; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  button.mic { width: 48px; height: 48px; padding: 0; border-radius: 50%; background: var(--raised);
    color: var(--fg); border: 1px solid var(--line); font-size: 20px; }
  button.mic.live { background: var(--red); border-color: var(--red); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .pair { margin: auto; max-width: 340px; text-align: center; display: flex; flex-direction: column; gap: 14px; }
  .pair h1 { font-size: 22px; margin: 0; }
  .pair p { color: var(--muted); margin: 0; }
  .row { display: flex; gap: 10px; align-items: center; }
  .switch { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <span class="brand">SHIRO</span>
  <label class="switch"><input type="checkbox" id="wake"> Atender pelo nome</label>
  <span class="state" id="state">desligada</span>
</header>
<main id="log"></main>
<div class="bar" id="bar"></div>
<footer id="composer">
  <button class="mic" id="mic" aria-label="Falar">🎤</button>
  <input id="text" placeholder="Fale ou digite para ela" autocomplete="off" enterkeyhint="send">
  <button id="send">Enviar</button>
</footer>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
    del: (k) => { try { localStorage.removeItem(k); } catch {} },
  };
  let token = store.get("shiro.token");
  let busy = false;
  const pending = new Map();
  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

  function bubble(cls, text, meta) {
    const el = document.createElement("div");
    el.className = cls;
    el.textContent = text;
    if (meta) { const m = document.createElement("div"); m.className = "meta"; m.textContent = meta; el.appendChild(m); }
    $("log").appendChild(el);
    el.scrollIntoView({ block: "end" });
    return el;
  }
  function state(text, on) { $("state").textContent = text; $("state").classList.toggle("on", !!on); }
  function bar(text) { $("bar").textContent = text || ""; $("bar").classList.toggle("show", !!text); }

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 401) { store.del("shiro.token"); token = null; showPairing("O aparelho foi desligado. Pareie de novo."); throw new Error("401"); }
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    return res.json();
  }

  // ---------------------------------------------------------------- fala
  function say(text) {
    if (!("speechSynthesis" in window) || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[*_#`]/g, ""));
    u.lang = "pt-BR";
    const voice = speechSynthesis.getVoices().find((v) => v.lang.startsWith("pt-BR") && /female|feminina|francisca|google/i.test(v.name))
      || speechSynthesis.getVoices().find((v) => v.lang.startsWith("pt"));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  }

  // ---------------------------------------------------------------- pedido
  async function send(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    if (pending.size && answerByVoice(text)) return;
    busy = true;
    bubble("you", text);
    bar("Pensando…");
    const started = performance.now();
    try {
      const r = await api("POST", "/v1/chat", { text });
      const secs = ((performance.now() - started) / 1000).toFixed(1);
      bubble("her", r.text || "(sem resposta)", [r.tier === "T0" ? "regra" : r.tier === "T2" ? "nuvem" : "local", secs + " s", ...(r.tools || [])].join(" · "));
      say(r.text);
    } catch (e) {
      if (e.message !== "401") bubble("her", "Não consegui falar com o PC: " + e.message);
    } finally {
      busy = false;
      bar("");
    }
  }

  // ---------------------------------------------------------------- confirmações
  const YES = /^(sim|pode|confirma|confirmo|isso|claro|manda|vai|ok|beleza)\b/i;
  const NO = /^(n[aã]o|cancela|para|nem|negativo)\b/i;
  function answerByVoice(text) {
    const clean = text.replace(/^(ei\s+)?shiro[,\s]*/i, "").trim();
    const yes = YES.test(clean), no = NO.test(clean);
    if (!yes && !no) return false;
    const [id] = pending.keys();
    answer(id, yes);
    return true;
  }
  async function answer(id, approve) {
    const el = pending.get(id);
    pending.delete(id);
    if (el) el.remove();
    try { await api("POST", "/v1/confirmations/" + id, { approve }); } catch {}
  }
  async function pollConfirmations() {
    if (!token) return;
    try {
      const list = await api("GET", "/v1/confirmations");
      const seen = new Set(list.map((p) => p.id));
      for (const [id, el] of pending) if (!seen.has(id)) { el.remove(); pending.delete(id); }
      for (const p of list) {
        if (pending.has(p.id)) continue;
        const el = document.createElement("div");
        el.className = "confirm";
        const txt = document.createElement("span"); txt.textContent = p.prompt;
        const yes = document.createElement("button"); yes.textContent = "Sim"; yes.onclick = () => answer(p.id, true);
        const no = document.createElement("button"); no.textContent = "Não"; no.className = "ghost"; no.onclick = () => answer(p.id, false);
        const row = document.createElement("div"); row.className = "row"; row.append(yes, no);
        el.append(txt, row);
        $("log").appendChild(el);
        el.scrollIntoView({ block: "end" });
        pending.set(p.id, el);
        say(p.prompt + " Sim ou não?");
      }
    } catch {}
  }

  // ---------------------------------------------------------------- microfone
  let recognizer = null, wakeLoop = false, listening = false;
  function listenOnce(onText, { continuous = false } = {}) {
    if (!Speech) { bubble("her", "Este navegador não reconhece voz. Use o Chrome."); return; }
    if (listening) return;
    recognizer = new Speech();
    recognizer.lang = "pt-BR";
    recognizer.interimResults = false;
    recognizer.continuous = continuous;
    recognizer.onresult = (ev) => {
      const text = Array.from(ev.results).slice(ev.resultIndex).map((r) => r[0].transcript).join(" ");
      onText(text);
    };
    recognizer.onstart = () => { listening = true; $("mic").classList.add("live"); };
    recognizer.onend = () => {
      listening = false;
      $("mic").classList.remove("live");
      if (wakeLoop) setTimeout(startWake, 300);
    };
    recognizer.onerror = (ev) => {
      if (ev.error === "not-allowed") { wakeLoop = false; $("wake").checked = false; bubble("her", "O navegador bloqueou o microfone. Libere nas permissões do site."); }
    };
    try { recognizer.start(); } catch {}
  }
  function startWake() {
    if (!wakeLoop || busy) { if (wakeLoop) setTimeout(startWake, 800); return; }
    state("na escuta", true);
    listenOnce((text) => {
      const m = text.match(/\b(?:ei\s+)?(?:shiro|xiro|chiro)\b[,.\s]*(.*)$/i);
      if (!m) return;
      const rest = m[1].trim();
      if (rest) { send(rest); return; }
      say("Oi?");
      recognizer && recognizer.abort();
      wakeLoop = false;
      setTimeout(() => listenOnce((t) => { wakeLoop = $("wake").checked; send(t); }), 900);
    }, { continuous: true });
  }
  $("mic").onclick = () => {
    if (listening) { recognizer && recognizer.stop(); return; }
    speechSynthesis && speechSynthesis.cancel();
    const resume = wakeLoop; wakeLoop = false;
    if (recognizer) try { recognizer.abort(); } catch {}
    setTimeout(() => listenOnce((t) => { wakeLoop = resume; send(t); }), 200);
  };
  $("wake").onchange = () => {
    wakeLoop = $("wake").checked;
    store.set("shiro.wake", wakeLoop ? "1" : "0");
    if (wakeLoop) startWake(); else { recognizer && recognizer.abort(); state("conectada", true); }
  };

  // ---------------------------------------------------------------- pareamento
  function showPairing(message, code) {
    $("composer").style.display = "none";
    $("log").innerHTML = "";
    const box = document.createElement("div");
    box.className = "pair";
    box.innerHTML = '<h1>Ligar este celular</h1><p></p>' +
      '<input id="code" inputmode="numeric" placeholder="Código do programa do PC">' +
      '<input id="name" placeholder="Nome deste aparelho" value="Celular">' +
      '<button id="pairBtn">Parear</button>';
    box.querySelector("p").textContent = message || "No programa do PC, abra Dispositivos e leia o QR com a câmera, ou digite o código.";
    $("log").appendChild(box);
    if (code) box.querySelector("#code").value = code;
    box.querySelector("#pairBtn").onclick = async () => {
      try {
        const r = await api("POST", "/v1/pair", { code: box.querySelector("#code").value.trim(), name: box.querySelector("#name").value.trim() || "Celular" });
        token = r.token;
        store.set("shiro.token", token);
        history.replaceState(null, "", location.pathname);
        start();
      } catch (e) { box.querySelector("p").textContent = "Não deu: " + e.message; }
    };
    state("desligada");
  }

  async function start() {
    try { await api("GET", "/v1/me"); } catch (e) { if (e.message !== "401") showPairing("O PC não respondeu. A SHIRO está ligada?"); return; }
    $("log").innerHTML = "";
    $("composer").style.display = "flex";
    bubble("her", "Pronta. Fale ou digite.");
    state("conectada", true);
    if (store.get("shiro.wake") === "1") { $("wake").checked = true; wakeLoop = true; startWake(); }
    setInterval(pollConfirmations, 2000);
  }

  $("send").onclick = () => { send($("text").value); $("text").value = ""; };
  $("text").addEventListener("keydown", (e) => { if (e.key === "Enter") { send($("text").value); $("text").value = ""; } });
  if ("speechSynthesis" in window) speechSynthesis.getVoices();

  const code = new URLSearchParams(location.hash.slice(1)).get("pair");
  if (code && !token) showPairing("Confirme para ligar este celular à SHIRO.", code);
  else if (!token) showPairing();
  else start();
})();
</script>
</body>
</html>
