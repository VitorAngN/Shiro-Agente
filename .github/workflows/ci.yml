name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos e arquitetura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff (lint)
        run: uv run ruff check --output-format=github .
      - name: ruff (formatação)
        run: uv run ruff format --check .
      - name: pyright
        run: uv run pyright
      - name: import-linter (regras de arquitetura)
        run: uv run lint-imports

  tests:
    name: Testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term-missing

  security:
    name: Segredos e dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (histórico completo)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose
      - uses: astral-sh/setup-uv@v10.3.3
      - name: pip-audit (vulnerabilidades conhecidas)
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt > requirements-audit.txt
          uvx pip-audit --requirement requirements-audit.txt --no-deps --disable-pip --strict
