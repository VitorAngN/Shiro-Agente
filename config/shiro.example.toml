# SHIRO · configuração de exemplo
# Copie para %APPDATA%\SHIRO\shiro.toml e ajuste.
# Segredos (chaves de API) NÃO ficam aqui: use `shiro secrets set <provedor>`,
# que grava no Gerenciador de Credenciais do Windows.

[general]
assistant_name = "Shiro"
language = "pt-BR"
timezone = "America/Sao_Paulo"
city = ""                  # cidade fixa para o clima (ex.: "Curitiba"); vazio = detectar
location = "ip"            # sem cidade: "ip" detecta pela internet (ADR-0013); "off" desativa

[agent]
max_steps = 8              # limite de passos por turno
step_timeout_s = 20
turn_timeout_s = 60
max_history_messages = 8   # mensagens anteriores enviadas ao modelo

[router]
escalate_on_validation_failure = true   # T1 falhou 2x → tenta T2 se permitido
cloud_triggers = ["pensa bem", "pesquisa", "analisa com calma"]

[llm.local]
provider = "ollama"
base_url = "http://127.0.0.1:11434"
model = "qwen3:4b-instruct" # provisório até o benchmark do marco 1a (ADR-0010)
num_ctx = 4096             # cabe em GPU de 4 GB junto com os pesos
num_gpu = 99               # 99 = todas as camadas na GPU; 0 = só CPU (ADR-0010)
keep_alive = "30m"         # descarrega o modelo da GPU após inatividade (ADR-0011)

[llm.cloud]                # chave: "shiro secrets set gemini" (fica no cofre do Windows)
enabled = true
provider = "gemini"
model = "gemini-3.5-flash-lite"
fallback = []              # adaptadores Anthropic e OpenAI ainda não implementados
rpm_limit = 5              # ajustar ao limite real mostrado no AI Studio
daily_request_limit = 200  # acima disso, volta para o modelo local até o dia seguinte (UTC)
daily_budget_usd = 0.50    # idem, pelo custo estimado
price_input_per_mtok = 0.0 # US$ por milhão de tokens; 0 no plano gratuito
price_output_per_mtok = 0.0

[voice]
enabled = true
activation = "push_to_talk"            # push_to_talk | wake_word | both
push_to_talk_hotkey = "ctrl+alt+space"
input_device = "default"
output_device = "default"

[voice.stt]
engine = "faster-whisper"
model = "small"            # spike do marco 1b compara base e small na CPU
device = "cpu"             # cpu | cuda (GPU fica para o LLM, ver ADR-0010)
compute_type = "int8"
language = "pt"

[voice.tts]
engine = "kokoro"          # voz feminina da SHIRO (ADR-0012); "piper" como alternativa
voice = "pf_dora"
speed = 1.0                # <1 fala mais devagar

[voice.wake_word]          # Fase 2
engine = "openwakeword"
model_path = ""
threshold = 0.5
follow_up_window_s = 5

[policy]
read_only_mode = true      # primeiras semanas: tudo R1+ pede confirmação por voz
batch_confirm_threshold = 5
confirmation_timeout_s = 30
allowed_folders = ["~/Downloads", "~/Documents/SHIRO"]

# Apps que o SHIRO pode abrir e fechar. Formato curto: spotify = "spotify:"
# launch: caminho, comando do PATH ou URI | process: processo para fechar
# name: como ele fala o nome | aliases: outros nomes falados
[policy.allowed_apps.spotify]
launch = "spotify:"
process = "Spotify.exe"
name = "Spotify"

[policy.allowed_apps.vscode]
launch = "code"
process = "Code.exe"
name = "VS Code"
aliases = ["vs code", "visual studio code", "code"]

[policy.allowed_apps.chrome]
launch = "chrome"
process = "chrome.exe"
name = "Chrome"
aliases = ["google chrome", "navegador"]

[policy.allowed_apps.discord]
launch = "discord:"
process = "Discord.exe"
name = "Discord"

[policy.emergency]
hotkey = "ctrl+alt+shift+s"

[activities]
default_due_time = "23:59"     # usado quando só o dia é informado
reminder_default_time = "09:00" # lembrete com dia mas sem horário
alert_offsets = ["1d", "2h"]   # avisos antes do prazo
local_only = true              # atividades nunca vão para a nuvem

[memory]
embedding_model = "nomic-embed-text"   # via Ollama
default_local_only = true

[retention]
messages_days = 90
trash_days = 7
audit_days = 365

[api]                      # Fase 4
enabled = false
host = "127.0.0.1"
port = 8765

[logging]
level = "INFO"
max_file_mb = 10
backups = 5

