# SHIRO · configuração de exemplo
# Copie para %APPDATA%\SHIRO\shiro.toml e ajuste.
# Segredos (chaves de API) NÃO ficam aqui: use `shiro secrets set <provedor>`,
# que grava no Gerenciador de Credenciais do Windows.

[general]
assistant_name = "Shiro"
language = "pt-BR"
timezone = "America/Sao_Paulo"
city = ""                  # cidade fixa para o clima (ex.: "Curitiba"); vazio = detectar
location = "ip"            # sem cidade: "ip" detecta pela internet (ADR-0013); "off" desativa

[agent]
max_steps = 8              # limite de passos por turno
step_timeout_s = 20
turn_timeout_s = 60
max_history_messages = 8   # mensagens anteriores enviadas ao modelo

[router]
escalate_on_validation_failure = true   # T1 falhou 2x → tenta T2 se permitido
cloud_triggers = ["pensa bem", "pesquisa", "analisa com calma"]

[llm.local]
provider = "ollama"
base_url = "http://127.0.0.1:11434"
model = "qwen3:4b-instruct" # provisório até o benchmark do marco 1a (ADR-0010)
num_ctx = 4096             # cabe em GPU de 4 GB junto com os pesos
num_gpu = 99               # 99 = todas as camadas na GPU; 0 = só CPU (ADR-0010)
keep_alive = "30m"         # descarrega o modelo da GPU após inatividade (ADR-0011)

[llm.cloud]                # chave: "shiro secrets set gemini" (fica no cofre do Windows)
enabled = true
provider = "gemini"
model = "gemini-3.5-flash-lite"
fallback = []              # adaptadores Anthropic e OpenAI ainda não implementados
rpm_limit = 15             # ajustar ao limite real mostrado no AI Studio
daily_request_limit = 200  # acima disso, volta para o modelo local até o dia seguinte (UTC)
daily_budget_usd = 0.50    # idem, pelo custo estimado
price_input_per_mtok = 0.0 # US$ por milhão de tokens; 0 no plano gratuito
price_output_per_mtok = 0.0

[voice]
enabled = true
activation = "push_to_talk"            # push_to_talk | wake_word | both
push_to_talk_hotkey = "ctrl+alt+space"
stop_hotkey = "ctrl+alt+shift+s"      # para de falar e de ouvir na hora
input_device = "default"               # nome ou parte do nome; "shiro voice devices" lista
capture = "mme"                        # mme | wasapi | raw | exclusive; "shiro voice mic-test" compara
output_device = "default"
cue_volume = 0.15                      # bipe de "ouvindo"; 0 desliga

[voice.listen]
threshold = 0.5            # sensibilidade do detector de fala (Silero VAD)
start_timeout_s = 6        # desiste se ninguém falar
end_silence_ms = 700       # silêncio que encerra a frase
max_utterance_s = 15

[voice.stt]
engine = "faster-whisper"
model = "small"            # spike do marco 1b compara base e small na CPU
device = "cpu"             # cpu | cuda (GPU fica para o LLM, ver ADR-0010)
compute_type = "int8"
language = "pt"
beam_size = 1              # 1 = mais rápido
hotwords = true            # puxa o Whisper para "Shiro" e os nomes dos apps
# extra_words = ["Hollow Knight", "Valorant"]  # termos em inglês que você fala
commands = true            # corrige comando curto mal transcrito ("Ausa música." → "Pausa a música.")

[voice.tts]
engine = "edge"            # voz da SHIRO: "edge" (Microsoft, online) | "kokoro" (local) | "sapi" (Windows)
edge_voice = "pt-BR-FranciscaNeural"   # ou "pt-BR-ThalitaMultilingualNeural"
edge_pitch_hz = 0          # mais aguda: +10, +20
voice = "pf_dora"          # voz da Kokoro (usada sem internet)
speed = 1.0                # <1 fala mais devagar
kokoro_model = "int8"      # int8 (88 MB) | fp16 | fp32 (310 MB)
sapi_voice = "Maria"

[voice.wake_word]          # "Ei, Shiro" (Fase 2, ADR-0016): vale com activation = "wake_word" ou "both"
engine = "whisper"         # whisper: confere o nome com o Whisper, sem treino | openwakeword: leve, precisa de modelo
phrases = ["ei shiro", "oi shiro", "ok shiro", "hey shiro", "shiro"]
check_model = "base"       # Whisper rápido usado só para conferir o nome
model = "hey_jarvis"       # openwakeword: modelo embutido ou caminho de um .onnx treinado ("Ei, Shiro")
threshold = 0.5
follow_up_window_s = 5     # depois de responder, continua ouvindo por alguns segundos

[policy]
read_only_mode = true      # primeiras semanas: tudo R1+ pede confirmação por voz
batch_confirm_threshold = 5
confirmation_timeout_s = 30
allowed_folders = ["~/Downloads", "~/Documents/SHIRO"]
pc_control = true          # abrir sites, digitar, apertar teclas e clicar (ADR-0024)

# Apps que o SHIRO pode abrir e fechar. Formato curto: spotify = "spotify:"
# launch: caminho, comando do PATH ou URI | process: processo para fechar
# name: como ele fala o nome | aliases: outros nomes falados
[policy.allowed_apps.spotify]
launch = "spotify:"
process = "Spotify.exe"
name = "Spotify"

[policy.allowed_apps.vscode]
launch = "code"
process = "Code.exe"
name = "VS Code"
aliases = ["vs code", "visual studio code", "code"]

[policy.allowed_apps.chrome]
launch = "chrome"
process = "chrome.exe"
name = "Chrome"
aliases = ["google chrome", "navegador"]

[policy.allowed_apps.discord]
launch = "discord:"
process = "Discord.exe"
name = "Discord"

[policy.emergency]
hotkey = "ctrl+alt+shift+s"

[activities]
default_due_time = "23:59"     # usado quando só o dia é informado
reminder_default_time = "09:00" # lembrete com dia mas sem horário
alert_offsets = ["1d", "2h"]   # avisos antes do prazo
local_only = true              # atividades nunca vão para a nuvem

# Rotinas (ADR-0018): cada passo é uma ferramenta, e passa pela política como se fosse pedido sozinho.
# "modo estudo", "ativa a rotina estudo" ou um apelido exato disparam a rotina.
# [routines.estudo]
# description = "fecha distrações, abre o VS Code e baixa o volume"
# aliases = ["hora de estudar"]
# steps = [
#   { tool = "close_app", args = { app = "discord" } },
#   { tool = "open_app", args = { app = "vscode" } },
#   { tool = "set_volume", args = { level = 30 } },
#   { tool = "media_control", args = { action = "pause" } },
# ]

[memory]                   # "lembra que…" (ADR-0017); nunca vai para a nuvem
enabled = true
embedding_model = "Xenova/paraphrase-multilingual-MiniLM-L12-v2"   # ONNX na CPU (113 MB); "shiro setup"
embedding_file = "onnx/model_int8.onnx"
max_in_context = 3         # quantas memórias relevantes entram em cada pedido

[retention]
messages_days = 90
trash_days = 7
audit_days = 365

[api]                      # painel local (Fase 4, ADR-0019): "Abrir painel" na bandeja ou "shiro dashboard"
enabled = false            # true: liga o painel junto com a bandeja (sem abrir o navegador)
host = "127.0.0.1"         # só loopback: 127.0.0.1, ::1 ou localhost
port = 8765

[logging]
level = "INFO"
max_file_mb = 10
backups = 5

